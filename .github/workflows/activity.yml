name: Update recent activity

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update README with recent activity
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const username = 'ezyway';
            const events = await github.paginate(github.rest.activity.listPublicEventsForUser, {
              username,
              per_page: 100,
            });
            const lines = [];
            const seen = new Set();
            for (const ev of events) {
              if (lines.length >= 5) break;
              const repo = ev.repo && ev.repo.name ? ev.repo.name : '';
              const repoUrl = repo ? `https://github.com/${repo}` : '';
              let line = null;
              if (ev.type === 'PushEvent') {
                const commits = (ev.payload && ev.payload.commits) || [];
                const c = commits[commits.length - 1] || commits[0];
                const msg = c && c.message ? c.message.split('\n')[0] : 'pushed commits';
                const sha = c && c.sha ? c.sha.substring(0, 7) : '';
                const commitUrl = (c && c.sha && repo) ? `https://github.com/${repo}/commit/${c.sha}` : repoUrl;
                const key = `push:${repo}:${sha}:${msg}`;
                if (seen.has(key)) continue;
                seen.add(key);
                line = `- 🚀 Pushed to [${repo}](${repoUrl}): [\`${sha}\`](${commitUrl}) ${msg}`;
              } else if (ev.type === 'PullRequestEvent') {
                const pr = ev.payload.pull_request;
                const action = ev.payload.action || 'updated';
                const key = `pr:${pr && pr.number}:${action}`;
                if (seen.has(key)) continue;
                seen.add(key);
                line = `- 🔀 ${action[0].toUpperCase() + action.slice(1)} PR [#${pr.number}](${pr.html_url}) in [${repo}](${repoUrl})`;
              } else if (ev.type === 'IssuesEvent') {
                const issue = ev.payload.issue;
                const action = ev.payload.action || 'updated';
                const key = `issue:${issue && issue.number}:${action}`;
                if (seen.has(key)) continue;
                seen.add(key);
                line = `- 🗂️ ${action[0].toUpperCase() + action.slice(1)} issue [#${issue.number}](${issue.html_url}) in [${repo}](${repoUrl})`;
              } else if (ev.type === 'IssueCommentEvent') {
                const issue = ev.payload.issue;
                const key = `comment:${issue && issue.number}:${ev.id}`;
                if (seen.has(key)) continue;
                seen.add(key);
                line = `- 💬 Commented on [#${issue.number}](${issue.html_url}) in [${repo}](${repoUrl})`;
              } else if (ev.type === 'CreateEvent') {
                const refType = ev.payload.ref_type || 'resource';
                const ref = ev.payload.ref ? ` \`${ev.payload.ref}\`` : '';
                const key = `create:${repo}:${refType}:${ev.payload.ref || ''}`;
                if (seen.has(key)) continue;
                seen.add(key);
                line = `- 🌱 Created ${refType}${ref} in [${repo}](${repoUrl})`;
              } else if (ev.type === 'ReleaseEvent') {
                const rel = ev.payload.release;
                const key = `release:${repo}:${rel && rel.tag_name}`;
                if (seen.has(key)) continue;
                seen.add(key);
                line = `- 📦 Released [${rel.tag_name}](${rel.html_url}) in [${repo}](${repoUrl})`;
              } else if (ev.type === 'WatchEvent') {
                const key = `star:${repo}`;
                if (seen.has(key)) continue;
                seen.add(key);
                line = `- ⭐ Starred [${repo}](${repoUrl})`;
              } else if (ev.type === 'ForkEvent') {
                const forkee = ev.payload.forkee;
                const key = `fork:${repo}`;
                if (seen.has(key)) continue;
                seen.add(key);
                line = `- 🍴 Forked [${repo}](${repoUrl}) to [${forkee.full_name}](${forkee.html_url})`;
              }
              if (line) lines.push(line);
            }
            const content = lines.length ? lines.join('\n') : '- No recent public activity found.';
            const readmePath = 'README.md';
            const readme = fs.readFileSync(readmePath, 'utf8');
            const start = '<!--START_SECTION:activity-->';
            const end = '<!--END_SECTION:activity-->';
            const pattern = new RegExp(`${start}[\\s\\S]*?${end}`);
            const updated = readme.replace(pattern, `${start}\n${content}\n${end}`);
            if (updated !== readme) {
              fs.writeFileSync(readmePath, updated);
            }
            core.exportVariable('ACTIVITY_CHANGED', updated !== readme ? '1' : '0');

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m ":zap: update recent activity"
          git push
