name: Update contribution stats

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compute contribution and profile stats
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const login = 'ezyway';

            const gql = `
              query($login: String!) {
                user(login: $login) {
                  followers { totalCount }
                  following { totalCount }
                  contributionsCollection {
                    contributionCalendar {
                      totalContributions
                      weeks { contributionDays { contributionCount date } }
                    }
                    totalCommitContributions
                    totalPullRequestContributions
                    totalPullRequestReviewContributions
                    totalIssueContributions
                    restrictedContributionsCount
                  }
                }
                mergedPRs: search(query: "author:ezyway is:pr is:merged", type: ISSUE, first: 1) { issueCount }
                closedIssues: search(query: "author:ezyway is:issue is:closed", type: ISSUE, first: 1) { issueCount }
                openPRs: search(query: "author:ezyway is:pr is:open", type: ISSUE, first: 1) { issueCount }
                openIssues: search(query: "author:ezyway is:issue is:open", type: ISSUE, first: 1) { issueCount }
              }
            `;
            const data = await github.graphql(gql, { login });
            const user = data.user;
            const cc = user.contributionsCollection;
            const cal = cc.contributionCalendar;
            const days = cal.weeks.flatMap(w => w.contributionDays);

            const total = cal.totalContributions;
            const activeDays = days.filter(d => d.contributionCount > 0).length;
            const avgPerDay = days.length ? (total / days.length).toFixed(2) : '0.00';

            const busiestDay = days.reduce((a, b) => (b.contributionCount > a.contributionCount ? b : a), days[0] || { contributionCount: 0, date: 'n/a' });
            const weekSums = cal.weeks.map(w => ({
              sum: w.contributionDays.reduce((s, d) => s + d.contributionCount, 0),
              start: w.contributionDays[0] && w.contributionDays[0].date,
              end: w.contributionDays[w.contributionDays.length - 1] && w.contributionDays[w.contributionDays.length - 1].date,
            }));
            const busiestWeek = weekSums.reduce((a, b) => (b.sum > a.sum ? b : a), weekSums[0] || { sum: 0, start: 'n/a', end: 'n/a' });

            let longest = 0, cur = 0;
            for (const d of days) {
              if (d.contributionCount > 0) { cur += 1; if (cur > longest) longest = cur; }
              else { cur = 0; }
            }
            let current = 0;
            for (let i = days.length - 1; i >= 0; i--) {
              if (days[i].contributionCount > 0) current += 1; else break;
            }

            const repos = await github.paginate(github.rest.repos.listForUser, {
              username: login,
              type: 'owner',
              per_page: 100,
            });
            const owned = repos.filter(r => !r.fork);
            const stars = owned.reduce((s, r) => s + (r.stargazers_count || 0), 0);
            const forks = owned.reduce((s, r) => s + (r.forks_count || 0), 0);
            const publicRepos = owned.length;

            const lines = [
              '| Contributions (last year) | Value |',
              '|---|---:|',
              `| Total contributions | **${total}** |`,
              `| Active days | **${activeDays}** / ${days.length} |`,
              `| Average per day | **${avgPerDay}** |`,
              `| Busiest day | **${busiestDay.contributionCount}** (${busiestDay.date}) |`,
              `| Busiest week | **${busiestWeek.sum}** (${busiestWeek.start} → ${busiestWeek.end}) |`,
              `| Current streak | **${current}** day(s) |`,
              `| Longest streak | **${longest}** day(s) |`,
              '',
              '| Breakdown (last year) | Value |',
              '|---|---:|',
              `| Commits | **${cc.totalCommitContributions}** |`,
              `| Pull requests opened | **${cc.totalPullRequestContributions}** |`,
              `| Pull request reviews | **${cc.totalPullRequestReviewContributions}** |`,
              `| Issues opened | **${cc.totalIssueContributions}** |`,
              `| Restricted contributions | **${cc.restrictedContributionsCount}** |`,
              '',
              '| PR / Issue activity | Value |',
              '|---|---:|',
              `| Pull requests merged (all-time) | **${data.mergedPRs.issueCount}** |`,
              `| Pull requests open | **${data.openPRs.issueCount}** |`,
              `| Issues closed (all-time) | **${data.closedIssues.issueCount}** |`,
              `| Issues open | **${data.openIssues.issueCount}** |`,
              '',
              '| Repo impact & reach | Value |',
              '|---|---:|',
              `| Stars received (owned, non-fork) | **${stars}** |`,
              `| Forks received (owned, non-fork) | **${forks}** |`,
              `| Public repositories (owned, non-fork) | **${publicRepos}** |`,
              `| Followers | **${user.followers.totalCount}** |`,
              `| Following | **${user.following.totalCount}** |`,
            ];
            const content = lines.join('\n');
            const readmePath = 'README.md';
            const readme = fs.readFileSync(readmePath, 'utf8');
            const start = '<!--START_SECTION:snake-stats-->';
            const end = '<!--END_SECTION:snake-stats-->';
            const pattern = new RegExp(`${start}[\\s\\S]*?${end}`);
            const updated = readme.replace(pattern, `${start}\n${content}\n${end}`);
            if (updated !== readme) {
              fs.writeFileSync(readmePath, updated);
            }

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m ":bar_chart: update contribution stats"
          git push
